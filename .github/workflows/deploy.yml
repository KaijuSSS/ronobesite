name: Deploy to GitHub Pages

# Публикация фронтенда на GitHub Pages после отправки в main.
#
# Сейчас публикация ВЫКЛЮЧЕНА: сайт разрабатывается локально.
# Чтобы включить, в настройках репозитория:
#   1. Settings → Pages → Source: GitHub Actions.
#   2. Settings → Secrets and variables → Actions → Variables:
#        PAGES_ENABLED          = true
#        VITE_SUPABASE_URL      = https://<ref>.supabase.co
#        VITE_SUPABASE_ANON_KEY = <anon / publishable key>
#
# Это публичные значения (они всё равно попадают в JS в браузере), поэтому
# хранятся как переменные, а не секреты. Ключ service_role сюда НЕ добавлять.
# Важно: сайт GitHub Pages публичен даже для приватного репозитория
# (ограничить доступ можно только на тарифе Enterprise). Данные при этом
# защищены входом и RLS — см. SECURITY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Сайт открывается по адресу https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
